[project]
name = "saddlery"
version = "0.0.1"
description = "Agent Saddlery core — a general-purpose agent harness"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "anthropic>=0.49",
]

[project.scripts]
saddlery = "saddlery.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "ty>=0.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saddlery"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "N", "PT", "TC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests favour readability over lint strictness.
"tests/**" = ["PT", "RUF015"]

[tool.ruff.format]
# Black-compatible defaults; line-length inherited from [tool.ruff].

[tool.ty.environment]
python-version = "3.12"

[tool.ty.terminal]
# Fail CI on any warning-level diagnostic, not just errors —
# this is ty's strictness knob: every diagnostic becomes blocking.
error-on-warning = true
